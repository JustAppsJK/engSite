<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksperyment: Czas Reakcji - Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a3a5f;
            --accent-blue: #3498db;
            --bg-page: #ffffff;
            --card-bg: #f8fafc;
            --text-dark: #2c3e50;
            --border-color: #e2e8f0;
            --success-green: #2ecc71;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--primary-blue); 
            color: var(--text-dark);
            min-height: 100vh;
        }

        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
        }

        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 15px 40px;
        }

        .nav-links a { text-decoration: none; color: var(--primary-blue); font-weight: 600; font-size: 0.9rem; }

        .main-content { padding: 40px 20px; max-width: 800px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; padding: 0 10px; }
        .header h2 { color: var(--primary-blue); font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #64748b; font-size: 0.95rem; }

        /* Panel Eksperymentu */
        .experiment-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .stats-bar {
            display: flex;
            justify-content: center; 
            gap: 20px;              
            margin-bottom: 30px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-item { 
            font-weight: 600; 
            color: var(--primary-blue);
            font-size: 1rem;
            white-space: nowrap; 
        }

        .stat-item span { 
            color: var(--accent-blue); 
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace; 
        }

        .game-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 40px 0;
            min-height: 120px;
        }

        /* Ulepszone responsywne tarcze (zawsze idealne koła) */
        .btn-target {
            width: 22vw;
            height: 22vw;
            max-width: 90px;
            max-height: 90px;
            border-radius: 50%;
            border: 4px solid #cbd5e1;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
            flex-shrink: 0; /* Blokada przed deformacją w flexboksie */
        }

        .btn-target.active {
            background: var(--success-green);
            border-color: #27ae60;
            transform: scale(1.08);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        /* Przyciski sterujące */
        .btn-main {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            width: 100%;
            max-width: 280px;
        }

        .btn-main:hover { background: var(--accent-blue); }

        /* Link zmieniony w nowoczesny przycisk Google Play Store */
        .google-play-btn-container {
            text-align: center;
            margin: 40px 0;
            padding: 0 10px;
        }

        .btn-google-play {
            display: inline-block;
            background: #fff;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        .btn-google-play:hover {
            background: var(--primary-blue);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(26, 58, 95, 0.2);
        }

        .back-container { text-align: center; margin-top: 30px; padding-bottom: 40px; }
        .back-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .back-link:hover { text-decoration: underline; }

        .hidden { display: none; }

        /* Ekran mobilny - poprawki nakładania */
        @media (max-width: 480px) {
            .main-content { padding: 20px 15px; }
            .header h2 { font-size: 1.6rem; }
            .stats-bar { gap: 15px; padding: 10px; }
            .stat-item { font-size: 0.9rem; }
            .stat-item span { font-size: 1.1rem; }
            .game-area { gap: 15px; margin: 30px 0; }
            .btn-target { border-width: 3px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">


        <main class="main-content">
            <div class="header">
                <h2>Experiment Programming</h2>
                <p>Example of a simple reaction time test.</p>
            </div>

            <div class="experiment-card">
                <!-- Stats -->
                <div class="stats-bar">
                    <div class="stat-item">
                        Time: <span id="timer">0.0</span>s
                    </div>
                    <div class="stat-item">
                        Round: <span id="score">0</span> / 5
                    </div>
                </div>

                <!-- Start Screen -->
                <div id="start-screen">
                    <p style="margin-bottom: 25px; color: #475569; font-size: 0.95rem; line-height: 1.5;">
                        Click the button that lights up green as quickly as possible. The test consists of 5 rounds.
                    </p>
                    <button class="btn-main" onclick="startGame()">START TEST</button>
                </div>

                <!-- Game Area -->
                <div id="game-screen" class="hidden">
                    <div class="game-area">
                        <button class="btn-target" id="target-0" onclick="checkClick(0)"></button>
                        <button class="btn-target" id="target-1" onclick="checkClick(1)"></button>
                        <button class="btn-target" id="target-2" onclick="checkClick(2)"></button>
                    </div>
                </div>
            </div>

            <!-- Google Play CTA -->
            <div class="google-play-btn-container">
                <a href="https://play.google.com/store/apps/dev?id=5700654377016469645" target="_blank" class="btn-google-play">
                    I also create and publish more complex games on Google Play Store
                </a>
            </div>

            <div class="back-container">
                <a href="../demo.html" class="back-link">← Back to project list</a>
            </div>
        </main>
    </div>

    <script>
        let score = 0;
        let gameActive = false;
        let currentTarget = -1;
        let timerInterval;

        function startGame() {
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            gameActive = true;
            startTimer();
            nextRound();
        }

        function startTimer() {
            let totalTime = 0;
            document.getElementById('timer').textContent = "0.0";
            timerInterval = setInterval(() => {
                totalTime += 0.1;
                document.getElementById('timer').textContent = totalTime.toFixed(1);
            }, 100);
        }

        function nextRound() {
            document.querySelectorAll('.btn-target').forEach(b => b.classList.remove('active'));
            currentTarget = -1; // Reset celu przed losowaniem delayu
            
            const delay = Math.random() * 1500 + 500;
            
            setTimeout(() => {
                if (!gameActive) return;
                currentTarget = Math.floor(Math.random() * 3);
                document.getElementById(`target-${currentTarget}`).classList.add('active');
            }, delay);
        }

        function checkClick(index) {
            if (!gameActive || index !== currentTarget) return;

            if (document.getElementById(`target-${index}`).classList.contains('active')) {
                score++;
                document.getElementById('score').textContent = score;
                document.getElementById(`target-${index}`).classList.remove('active');
                currentTarget = -1;
                
                if (score >= 5) {
                    endGame();
                } else {
                    nextRound();
                }
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            alert("Test finished! Your time: " + document.getElementById('timer').textContent + "s");
            location.reload(); 
        }
    </script>
</body>
</html>
