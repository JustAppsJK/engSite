<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analiza Tras - Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-blue: #1a3a5f;
            --accent-blue: #3498db;
            --bg-page: #ffffff;
            --text-dark: #2c3e50;
            --border-color: #e1e8ed;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--primary-blue); 
            color: var(--text-dark);
            min-height: 100vh;
        }

        .lang-pl .en { display: none; }
        .lang-en .pl { display: none; }

        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--bg-page);
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
        }

        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 15px 40px;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--primary-blue); font-weight: 600; font-size: 0.9rem; }

        .lang-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .main-content { padding: 40px; max-width: 1000px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: var(--primary-blue); font-size: 2rem; margin-bottom: 10px; }
        .header p { color: #576574; line-height: 1.6; }

        .map-card {
            background: #fdfdfd;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }

        #map { 
            width: 100%; 
            height: 500px; 
            border-radius: 8px; 
            margin-bottom: 20px;
            z-index: 1;
        }

        .instruction {
            padding: 15px;
            background: #f0f7ff;
            border-left: 4px solid var(--accent-blue);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .controls { text-align: center; }

        .btn-animate { 
            background: var(--accent-blue); 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-animate:hover { background: #2980b9; }
        .btn-animate:disabled { background: #bdc3c7; cursor: not-allowed; }

        .back-container { text-align: center; margin-top: 40px; padding-bottom: 40px; }
        .back-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .main-content { padding: 20px; }
            #map { height: 350px; }
        }
    </style>
</head>
<body class="lang-pl">

    <div class="page-wrapper">

        </nav>

        <main class="main-content">
            <div class="header">
                <h2>
                    <span>Mobile Data Visualization</span>
                </h2>
                <p>
                    <span>Presentation of dynamic user paths based on GPS logs.</span>
                </p>
                 <p>
                    <span>Example - location history during a day.</span>
                </p>
                
            </div>
            <div class="map-card">

                <div id="map"></div>

                <div class="controls">
                    <button id="start-animation" class="btn-animate">
                        <span>Play Route</span>
                    </button>
                </div>
            </div>

            <div class="back-container">
                <a href="../demo.html" class="back-link">
                    <span>← Back to project list</span>
                </a>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Języki
        const langToggle = document.getElementById('lang-toggle');
        

        // Mapa - Warszawa
        const map = L.map('map').setView([52.2297, 21.0122], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Punkty trasy (Warszawa)
        const routeData = [
            { coords: [52.2297, 21.0122], labelPl: "9:00", labelEn: " " },
            { coords: [52.2410, 21.0360], labelPl: "12:00", labelEn: " " },
            { coords: [52.2190, 21.0110], labelPl: "14:00", labelEn: " " },
            { coords: [52.2350, 20.9850], labelPl: "16:00", labelEn: " " },
            { coords: [52.2510, 21.0010], labelPl: "18:00", labelEn: " " }
        ];

        const btn = document.getElementById('start-animation');
        let polyline = L.polyline([], { color: '#3498db', weight: 4, opacity: 0.7 }).addTo(map);
        let markers = [];

        btn.addEventListener('click', function() {
            // Reset
            btn.disabled = true;
            if (polyline) polyline.setLatLngs([]);
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            let i = 0;
            const interval = setInterval(() => {
                if (i < routeData.length) {
                    const point = routeData[i];
                    const currentLang = document.body.classList.contains('lang-pl') ? 'pl' : 'en';
                    const label = currentLang === 'pl' ? point.labelPl : point.labelEn;

                    // Dodaj punkt do linii
                    polyline.addLatLng(point.coords);

                    // Dodaj marker
                    const m = L.marker(point.coords).addTo(map)
                        .bindPopup(label).openPopup();
                    markers.push(m);

                    // Centruj na nowym punkcie
                    map.panTo(point.coords);

                    i++;
                } else {
                    clearInterval(interval);
                    btn.disabled = false;
                }
            }, 1200); // Prędkość pojawiania się punktów
        });

        // Fix dla renderowania mapy
        setTimeout(() => map.invalidateSize(), 500);
    </script>
</body>
</html>
